# 校园二手交易平台前端 —— nginx 部署配置
#
# 使用方式（Linux 服务器）：
#   1. 本地执行 npm run build，把 dist/ 上传到 /usr/share/nginx/html
#   2. 把本文件放到 /etc/nginx/conf.d/campus-market.conf
#   3. nginx -t && systemctl reload nginx
#
# Docker 方式见同目录 Dockerfile。

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # ---------- 压缩 ----------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # ---------- 安全响应头 ----------
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---------- 带哈希的静态资源：长缓存 ----------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ---------- index.html 不缓存，保证发版后立即生效 ----------
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ---------- 前端路由（hash 模式其实只请求 index.html，这里仍保留回退） ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 接口反向代理 ----------
    # 前端 .env 里把 VITE_API_BASE 设为 /v1，构建后请求同源 /v1/*，
    # 由 nginx 转发到后端，浏览器侧不产生跨域。
    # 把 api:8080 换成真实后端地址，例如 http://10.0.0.12:8080。
    #
    # location /v1/ {
    #     proxy_pass         http://api:8080/v1/;
    #     proxy_http_version 1.1;
    #     proxy_set_header   Host              $host;
    #     proxy_set_header   X-Real-IP         $remote_addr;
    #     proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header   X-Forwarded-Proto $scheme;
    #     proxy_read_timeout 60s;
    # }

    # ---------- 健康检查 ----------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    error_page 404 /index.html;
}
